 <main class="main-content">
    <div class="startbox2">

            <div class="modelcard">
                <img src="bilder/model1.png" alt="Model 1">

  <script>
   
    document.querySelectorAll('.modelcard img, .featured-box img').forEach(img => {
      img.style.cursor = 'pointer';
      
      img.addEventListener('click', function() {
        const src = this.getAttribute('src');
        
        const fileName = src.replace('bilder/', '').replace('.png', '').replace('.jpg', '');
        window.location.href = 'productpage.html?id=' + fileName;
      });
    });


    const currencySelect = document.getElementById('currency-select');
    const languageSelect = document.getElementById('language-select');

    currencySelect.addEventListener('change', function() {
      localStorage.setItem('currency', this.value);
    });

    languageSelect.addEventListener('change', function() {
      localStorage.setItem('language', this.value);
    });

    window.addEventListener('DOMContentLoaded', function() {
      const savedCurrency = localStorage.getItem('currency');
      const savedLanguage = localStorage.getItem('language');
      if (savedCurrency) currencySelect.value = savedCurrency;
      if (savedLanguage) languageSelect.value = savedLanguage;
    });

    
    const modelImages = [
      [
        "bilder/model1.png",
        "bilder/model2.png",
        "bilder/model3.png",
        "bilder/model4.png"
      ],
      [
        "bilder/11.png",
        "bilder/22.png",
        "bilder/33.png",
        "bilder/44.png"
      ]
    ];

    let currentSet = 0;
    const cards = document.querySelectorAll('.modelcard img');

    function changeModels(direction) {
      currentSet = (currentSet + direction + modelImages.length) % modelImages.length;
      cards.forEach((img, index) => {
        img.src = modelImages[currentSet][index];
      });
    }

    document.querySelector('.next-arrow').addEventListener('click', () => changeModels(1));
    document.querySelector('.prev-arrow').addEventListener('click', () => changeModels(-1));

    
    const menuBtn = document.querySelector('.menu-btn');
    const closeMenuBtn = document.getElementById('close-menu-btn');
    const sideMenu = document.getElementById('side-menu');
    const menuOverlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', () => {
      sideMenu.classList.add('open');
      menuOverlay.classList.add('open');
    });

    function closeMenu() {
      sideMenu.classList.remove('open');
      menuOverlay.classList.remove('open');
    }

    closeMenuBtn.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);


    function updateCartDot() {
      const cart = JSON.parse(localStorage.getItem('veya_cart')) || [];
      const dot = document.getElementById('cart-dot');
      if (dot) {
        dot.classList.toggle('active', cart.length > 0);
      }
    }

    updateCartDot();
    window.addEventListener('pageshow', updateCartDot);
  </script>
</body>
</html>

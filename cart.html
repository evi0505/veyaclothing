<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | VEYA</title>
  <link rel="stylesheet" href="CSS/cart.css">
</head>
<body>

  <header class="top-bar">
    <a href="index.html" class="back-arrow" title="Zurück zur Startseite">←</a>
    <a href="index.html" class="header-logo" title="Zurück zur Startseite">
      <img src="bilder/logo.png" alt="VEYA">
    </a>
  </header>

  <main class="cart-wrapper">
    <h1 class="cart-title">Shopping Cart</h1>

    <div class="cart-grid">
      <div id="cart-list" class="cart-items"></div>

      <aside class="order-summary">
        <h2 class="summary-heading">Order Summary</h2>
        <div class="summary-line">
          <span>Subtotal</span>
          <span id="subtotal">0 €</span>
        </div>
        <div class="summary-line">
          <span>Shipping</span>
          <span id="shipping">Free</span>
        </div>
        <div class="summary-total">
          <span>Total</span>
          <span id="total">0 €</span>
        </div>
        <button type="button" class="checkout-btn" onclick="placeOrder()">Checkout</button>
        <p class="shipping-hint">Free shipping on orders over 100€</p>
        <p id="order-status" class="order-msg"></p>
      </aside>
    </div>
  </main>

  <footer class="footer-bottom">
    <div class="footer-column">
      <strong>Yeva Krempokha</strong>
      <p>Example Street 13</p>
      <p>0000 Berlin Germany</p>
    </div>

    <div class="footer-column">
      <strong>Contact</strong>
      <p><span class="contact-icon">✉</span> krempokhayeva@gmail.com</p>
      <p><span class="contact-icon">☎</span> +4917620983521</p>
    </div>

    <div class="footer-column">
      <strong>Social Media</strong>
      <a href="https://instagram.com" target="_blank" class="social-link">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        Instagram
      </a>
      <a href="https://facebook.com" target="_blank" class="social-link">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M13.5 20V12h2.7l.4-3h-3.1V7.1c0-.9.3-1.5 1.6-1.5h1.7V2.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V9H7.5v3h2.6v8z" fill="currentColor"/>
        </svg>
        Facebook
      </a>
    </div>
  </footer>

  <script>
    let cartItems = JSON.parse(localStorage.getItem('veya_cart')) || [
      {
        name: "Oversized Studded Blazer",
        size: "S",
        price: 790,
        qty: 1,
        img: "bilder/pinkcostumemodel.png"
      }
    ];

    function renderCart() {
      const list = document.getElementById('cart-list');
      list.innerHTML = '';

      if (cartItems.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <p>Your shopping cart is currently empty.</p>
            <a href="product.html" class="continue-link">Continue Shopping</a>
          </div>
        `;
        calculateTotals(0);
        return;
      }

      let subtotal = 0;

      cartItems.forEach((item, index) => {
        const qty = item.qty || 1;
        subtotal += item.price * qty;

        list.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-img">
              <img src="${item.img}" alt="${item.name}">
            </div>
            <div class="cart-item-info">
              <span class="cart-item-name">${item.name}</span>
              <span class="cart-item-meta">Size: ${item.size}</span>
              <span class="cart-item-price">${item.price} €</span>
            </div>
            <div class="cart-item-actions">
              <div class="qty-box">
                <button type="button" class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                <span class="qty-val">${qty}</span>
                <button type="button" class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
              </div>
              <button type="button" class="remove-btn" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
      });

      calculateTotals(subtotal);
    }

    function changeQty(index, delta) {
      const currentQty = cartItems[index].qty || 1;
      const newQty = currentQty + delta;

      if (newQty <= 0) {
        removeItem(index);
      } else {
        cartItems[index].qty = newQty;
        saveAndRender();
      }
    }

    function removeItem(index) {
      cartItems.splice(index, 1);
      saveAndRender();
    }

    function calculateTotals(subtotal) {
      const shipping = (subtotal > 0 && subtotal < 100) ? 10 : 0;
      document.getElementById('subtotal').textContent = subtotal + ' €';
      document.getElementById('shipping').textContent = shipping === 0 ? 'Free' : shipping + ' €';
      document.getElementById('total').textContent = (subtotal + shipping) + ' €';
    }

    function saveAndRender() {
      localStorage.setItem('veya_cart', JSON.stringify(cartItems));
      renderCart();
    }

    function placeOrder() {
      if (cartItems.length === 0) return;
      document.getElementById('order-status').textContent = 'THANK YOU! YOUR ORDER HAS BEEN PLACED.';
      cartItems = [];
      localStorage.setItem('veya_cart', JSON.stringify(cartItems));
      setTimeout(() => {
        document.getElementById('order-status').textContent = '';
        renderCart();
      }, 2500);
    }

    renderCart();
  </script>

</body>
</html>
